<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="HI THERE, I am karliar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#123a40"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#39c5bb" opacity="0.16"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39c5bb" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#39c5bb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="260" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <circle cx="1080" cy="20" r="260" fill="url(#glow)"/>

    <rect x="48" y="84" width="5" height="100" rx="2.5" fill="url(#accent)"/>

    <text x="76" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
          font-size="52" font-weight="700" fill="#e6fffb" letter-spacing="3">HI THERE</text>
    <text x="78" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
          font-size="21" fill="#39c5bb">I am karliar, I rebuild things from scratch.</text>
    <text x="78" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
          font-size="14" fill="#7d8aa0" letter-spacing="1">github.com/xiaobin118</text>

    <rect x="812" y="56" width="330" height="150" rx="14"
          fill="#0d1117" fill-opacity="0.55" stroke="#39c5bb" stroke-opacity="0.35"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5">
      <text x="838" y="90"  fill="#7d8aa0">$ whoami</text>
      <text x="838" y="112" fill="#e6fffb">xiaobin118</text>
      <text x="838" y="142" fill="#7d8aa0">$ cat ~/.stack</text>
      <text x="838" y="164" fill="#39c5bb">C++ Python TypeScript Java</text>
      <text x="838" y="188" fill="#7aa2f7">$ echo $MOTTO   # from scratch</text>
    </g>
  </g>
</svg>
